<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Courses</title>
  </head>
  <body>
    <h1>Course List</h1>
    <ul>
      {% for course, description in courses.items %}
      <li>
        <h2>{{course}}</h2>
        <p>{{description}}</p>
      </li>
      {% endfor %}
    </ul>
  </body>
</html>
